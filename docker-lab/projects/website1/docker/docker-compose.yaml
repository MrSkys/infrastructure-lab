services:
  web:
    build:
      context: ../DockerTestApp/frontend
      dockerfile: ../../docker/Dockerfile.frontend
    environment:
      - REACT_APP_API_URL=http://10.134.41.24:3001 
    ports:
      - 3000:3000
  api:
    build:
      context: ../DockerTestApp/backend
      dockerfile: ../../docker/Dockerfile.backend
    ports:
      - 3001:3001
    environment:
      - DB_URL=mongodb://admin:pass123@db:27017/?authSource=admin
    restart: always
    depends_on:
      - db
    command: ["node", "index.js"]
  db:
    image: mongo:4.4
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass123
    volumes:
      - mongodb-sepehr:/data/db
  mongoExpress:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=sepehr
      - ME_CONFIG_BASICAUTH_PASSWORD=passpass
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass123
      - ME_CONFIG_MONGODB_SERVER=db
    depends_on:
      - db
volumes:
  mongodb-sepehr:
   




