services:
  mongodb1:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=pass123

  mongo-express1:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=sepehr
      - ME_CONFIG_BASICAUTH_PASSWORD=passpass
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=pass123
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb1:27017
      - ME_CONFIG_MONGODB_SERVER=mongodb1
